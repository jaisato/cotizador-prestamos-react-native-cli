name: CI

# iOS builds in its own workflow, .github/workflows/ios.yml.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded PR runs are cancelled; runs on master are not.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Jest
        run: npx jest --ci

      # The tests of scripts/. They never reach the registry or GitHub: npm and
      # gh are fakes.
      - name: Tests of scripts/
        run: npm run test:scripts

      # Fails on any advisory except GHSA-vfj7-8cjw-p6xm (braces), and on that
      # one as soon as it has a patched version, which the script asks the
      # GitHub Advisory Database (with the token) or the npm registry. The
      # reason is in scripts/audit-ci.mjs and the README.
      - name: npm audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run audit:ci

      - name: Metro bundle (android)
        run: |
          mkdir -p "$RUNNER_TEMP/android"
          npx react-native bundle --platform android --dev false \
            --entry-file index.js \
            --bundle-output "$RUNNER_TEMP/android/index.android.bundle" \
            --assets-dest "$RUNNER_TEMP/android/res"

      - name: Metro bundle (ios)
        run: |
          mkdir -p "$RUNNER_TEMP/ios"
          npx react-native bundle --platform ios --dev false \
            --entry-file index.js \
            --bundle-output "$RUNNER_TEMP/ios/main.jsbundle" \
            --assets-dest "$RUNNER_TEMP/ios"

  # Fails a PR that adds a dependency with a known advisory of any severity,
  # in every manifest GitHub reads (package-lock.json, Gemfile, Gemfile.lock,
  # the workflows). npm audit only sees npm; this also covers the gems.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          # braces has no patched release: see scripts/audit-ci.mjs and the
          # README.
          allow-ghsas: GHSA-vfj7-8cjw-p6xm

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The Gradle build reads react-native and the autolinked libraries from
      # node_modules.
      - run: npm ci

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # Checks gradle-wrapper.jar against the checksums Gradle publishes, and
      # caches Gradle. "basic" is the open-source cache provider, the same
      # strategy as setup-java's cache: gradle; the default one is proprietary.
      # The wrapper itself checks the distribution (distributionSha256Sum).
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # Release is signed with the debug keystore, as the template does.
      - name: Gradle assembleDebug assembleRelease
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error

      # The debug keystore is the template's, and its key is public: this APK
      # is for testing and is not distributed (see the README). Unarchived
      # artifacts take the file's name, so the name says which key signed it.
      - name: Name the release APK after its key
        run: cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release-debugkey.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/app-release-debugkey.apk
          archive: false
          if-no-files-found: error
